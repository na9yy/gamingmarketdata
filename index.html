  <style>
    :root {
      /* matched to gameboost.com */
      --blue: #0B6CFB; --blue-light: #5AA8F7; --blue-glow: rgba(11,108,251,.4);
      --navy: #153151;
      --bg: #10151E; --panel: #161D28; --panel-2: #1D2532; --panel-3: #252F3F;
      --border: #232C3A; --text: #F4F6FA; --muted: #9AA6B8; --faint: #637085;
      --up: #3DDC84; --down: #F2555A; --new: #F5B83D; --flat: #8E95A3;
      --radius-lg: 16px; --radius-md: 12px; --radius-sm: 10px;
      --font: "Red Hat Display", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; color: var(--text); font: 500 15px/1.5 var(--font); -webkit-font-smoothing: antialiased;
      background:
        radial-gradient(1100px 520px at 50% -120px, rgba(21,49,81,.95), transparent 70%),
        radial-gradient(700px 400px at 85% 10%, rgba(61,123,247,.08), transparent 70%),
        var(--bg);
      background-repeat: no-repeat; }

    /* nav */
    .topbar-in { max-width: 1400px; margin: 0 auto; padding: 18px 32px; display: flex; align-items: center; gap: 28px; }
    .logo { display: flex; align-items: center; text-decoration: none; color: var(--text); }
    .logo img { height: 36px; width: auto; display: block; }
    .logo .wordmark { display: none; font-weight: 900; font-size: 20px; line-height: 1; letter-spacing: .3px; }
    .logo .wordmark span { color: var(--blue); }
    .logo.noimg img { display: none; } .logo.noimg .wordmark { display: inline; }
    .navlink { color: var(--text); font-weight: 600; font-size: 17px; text-decoration: none; }
    .navlink.hot { color: var(--up); display: inline-flex; align-items: center; gap: 8px; }
    .navlink.hot::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--up); box-shadow: 0 0 0 4px rgba(61,220,132,.18); }
    .meta { margin-left: auto; background: rgba(29,37,50,.85); border: 1px solid var(--border); color: var(--text);
      padding: 9px 16px; border-radius: 999px; font-size: 14px; font-weight: 600; white-space: nowrap; }
    .meta span { color: var(--muted); font-weight: 500; }

    /* hero */
    .hero { text-align: center; padding: 70px 24px 36px; }
    .hero h1 { margin: 0 auto 14px; max-width: 900px; font-size: clamp(36px, 5.2vw, 64px); line-height: 1.08; font-weight: 800; letter-spacing: -1px; }
    .hero h1 .grad { background: linear-gradient(90deg, var(--blue-light), var(--blue)); -webkit-background-clip: text; background-clip: text; color: transparent; }
    .hero p { margin: 0 auto; color: var(--muted); font-size: 19px; max-width: 640px; }
    .searchwrap { max-width: 740px; margin: 36px auto 0; padding: 6px; border-radius: 16px; background: rgba(22,29,40,.6); border: 1px solid var(--border); }
    .search { position: relative; }
    .search svg { position: absolute; left: 18px; top: 50%; transform: translateY(-50%); width: 20px; height: 20px; color: var(--muted); }
    .search input { width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text);
      border-radius: 12px; padding: 15px 18px 15px 50px; font: 500 16px var(--font); }
    .search input::placeholder { color: var(--faint); }

    /* service tiles, same pattern as the homepage row */
    .tabs { display: flex; justify-content: center; flex-wrap: wrap; gap: 28px; margin: 34px 0 0; }
    .tab { background: none; border: 0; padding: 0; cursor: pointer; color: var(--text); font: 600 16px var(--font);
      display: flex; flex-direction: column; align-items: center; gap: 12px; min-width: 92px; }
    .tab .ic { width: 52px; height: 52px; border-radius: 12px; background: var(--panel-2); border: 1px solid var(--border);
      display: grid; place-items: center; color: var(--blue); }
    .tab .ic svg { width: 24px; height: 24px; }
    .tab:hover .ic { background: var(--panel-3); }
    .tab.active .ic { background: var(--blue); border-color: var(--blue); color: #fff; box-shadow: 0 8px 24px var(--blue-glow); }
    .tab.active { color: #fff; }

    .wrap { max-width: 1400px; margin: 0 auto; padding: 16px 32px 72px; }

    .filters { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between;
      border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); padding: 14px 0; margin: 10px 0 8px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip { background: var(--panel); border: 1px solid var(--border); color: var(--muted); padding: 7px 14px;
      border-radius: 999px; cursor: pointer; font: 600 14px var(--font); }
    .chip:hover { color: var(--text); }
    .chip .n { color: var(--faint); margin-left: 6px; }
    .chip.active { color: #fff; background: var(--blue); border-color: var(--blue); }
    .chip.active .n { color: rgba(255,255,255,.75); }
    .chip.active[data-s="rising"] { background: rgba(61,220,132,.15); color: var(--up); border-color: rgba(61,220,132,.45); }
    .chip.active[data-s="breakout"] { background: rgba(245,184,61,.15); color: var(--new); border-color: rgba(245,184,61,.45); }
    .chip.active[data-s="falling"] { background: rgba(242,85,90,.15); color: var(--down); border-color: rgba(242,85,90,.45); }
    .controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
    .periods { display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 4px; gap: 2px; }
    .period { background: none; border: 0; color: var(--muted); padding: 7px 12px; border-radius: 8px; cursor: pointer;
      font: 700 13px var(--font); white-space: nowrap; }
    .period:hover { color: var(--text); }
    .period.active { background: var(--blue); color: #fff; box-shadow: 0 4px 14px var(--blue-glow); }
    .period:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }
    select { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: var(--radius-sm);
      padding: 9px 12px; font: 600 14px var(--font); }
    .tab:focus-visible, .chip:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible {
      outline: 2px solid var(--blue); outline-offset: 2px; }
    .hint { color: var(--faint); font-size: 13px; margin: 0 0 6px; }

    .section-title { display: flex; align-items: baseline; justify-content: center; gap: 10px; font-size: 34px; font-weight: 800;
      letter-spacing: -.6px; margin: 44px 0 22px; }
    .section-title .n { color: var(--muted); font-weight: 600; font-size: 16px; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; }
    .card { min-width: 0; background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius-lg); padding: 16px 16px 10px; }
    .card:hover { border-color: #33415A; }
    .card.dim { opacity: .5; }
    .card.dim:hover { opacity: .85; }
    .card .top { display: flex; align-items: center; gap: 12px; }
    .thumb { width: 46px; height: 46px; flex: none; border-radius: 12px; background: var(--panel-2);
      display: grid; place-items: center; overflow: hidden; font-weight: 800; color: var(--muted); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .name { min-width: 0; flex: 1; }
    .card .kw { font-size: 16px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text); text-decoration: none; display: block; }
    a.kw:hover { color: var(--blue-light); }
    .card .seg { font-size: 13px; color: var(--muted); }
    .card .val { text-align: right; }
    .card .num { font-size: 24px; font-weight: 800; letter-spacing: -.5px; line-height: 1; }
    .badge { display: inline-block; font-size: 12px; font-weight: 700; padding: 3px 8px; border-radius: 6px; margin-top: 6px; }
    .badge.rising { background: rgba(61,220,132,.14); color: var(--up); }
    .badge.breakout { background: rgba(245,184,61,.14); color: var(--new); }
    .badge.falling { background: rgba(242,85,90,.14); color: var(--down); }
    .badge.stable, .badge.low { background: var(--panel-2); color: var(--muted); }
    .sub { font-size: 13px; color: var(--muted); margin-top: 12px; }
    .chart-box { position: relative; height: 96px; margin: 6px -4px 0; min-width: 0; }

    .empty, .error { background: var(--panel); border: 1px dashed var(--border); border-radius: var(--radius-lg);
      padding: 44px; text-align: center; color: var(--muted); }
    .error { color: var(--down); }
    a { color: var(--blue-light); }

    @media (max-width: 760px) {
      .topbar-in { padding: 14px 18px; gap: 16px; }
      .navlink { display: none; }
      .navlink.hot { font-size: 15px; white-space: nowrap; }
      .meta span { display: none; }
      .meta { font-size: 12px; padding: 7px 12px; white-space: normal; text-align: right; line-height: 1.3; }
      .logo img { height: 28px; }
      .hero { padding: 40px 18px 24px; }
      .hero p { font-size: 16px; }
      .tabs { gap: 14px; }
      .tab { min-width: 72px; font-size: 14px; }
      .wrap { padding: 12px 18px 56px; }
      .section-title { font-size: 26px; }
      .grid { grid-template-columns: minmax(0, 1fr); }
      .controls, .periods { width: 100%; }
      .period { flex: 1; padding: 7px 4px; }
    }
  </style>
</head>

        .map(i => ({ ...i, s: score(i.series) }));
      renderChips(pool);

      const shown = pool.filter(i => state.status === "all" || i.s.status === state.status).sort(sortFn);
      if (!shown.length) { content.innerHTML = '<div class="empty">Nothing matches these filters.</div>'; return; }

      const bySeg = new Map();
      for (const i of shown) { if (!bySeg.has(i.segment)) bySeg.set(i.segment, []); bySeg.get(i.segment).push(i); }
      for (const [name, list] of bySeg) {
        const title = document.createElement("div");
        title.className = "section-title";
        title.innerHTML = `${esc(name)}<span class="n">${list.length}</span>`;
        content.appendChild(title);
        const grid = document.createElement("div"); grid.className = "grid";
        for (const i of list) { const c = keywordCard(i); grid.appendChild(c); observe(c); }
        content.appendChild(grid);
      }
    }

    function renderTabs() {
      const tabs = document.getElementById("tabs");
      tabs.innerHTML = "";
      const names = ["All", ...DATA.segments.map(s => s.name)];
      if (names.length <= 2) return; // only one segment, tabs add nothing
      for (const name of names) {
        const b = document.createElement("button");
        b.className = "tab" + (name === state.segment ? " active" : "");
        b.innerHTML = `<span class="ic">${SEG_ICON[name] || ""}</span>${esc(name)}`;
        b.onclick = () => { state.segment = name; update(); };
        tabs.appendChild(b);
      }
    }

    function renderHint() {
      const p = PERIODS[state.period];
      const [rN, bN] = state.win.split("-");
      const last = GRID[GRID.length - 1];
      document.getElementById("hint").textContent =
        (state.period === DEFAULT_PERIOD
          ? `Charts show the last 2 years (weekly data). Change compares avg interest in the last ${rN} weeks to the ${bN} weeks before. `
          : `Charts show the ${p.label.toLowerCase()} (weekly data). Change compares its avg interest to the ${p.text} before. `) +
        `Rising/Falling = change beyond ±${state.thr}%. Breakout = zero before, active now. ` +
        `Low data = under ${MIN_ACTIVE_WEEKS} active weeks. Latest week: ${last || "—"}.`;
    }

    function setPeriod(key) {
      state.period = PERIODS[key] ? key : DEFAULT_PERIOD;
      const p = PERIODS[state.period];
      state.win = p.win || `${p.weeks}-${p.weeks}`;
    }

    function compareText(s) {
      const p = PERIODS[state.period];
      if (state.period === DEFAULT_PERIOD) {
        const [rN, bN] = state.win.split("-");
        return `Avg ${s.recent.toFixed(1)} in the last ${rN} weeks vs ${s.base.toFixed(1)} in the ${bN} before.`;
      }
      return `Avg ${s.recent.toFixed(1)} in the last ${p.text} vs ${s.base.toFixed(1)} in the ${p.text} before.`;
    }

    function renderPeriods() {
      const box = document.getElementById("periods");
      box.innerHTML = "";
      for (const [key, p] of Object.entries(PERIODS)) {
        const b = document.createElement("button");
        b.className = "period" + (key === state.period ? " active" : "");
        b.textContent = p.short; b.title = p.label; b.setAttribute("aria-pressed", key === state.period);
        b.onclick = () => { setPeriod(key); update(); };
        box.appendChild(b);
      }
    }

    function writeHash() {
      const p = new URLSearchParams();
      if (state.segment !== "All") p.set("seg", state.segment);
      if (state.status !== "all") p.set("status", state.status);
      if (state.q) p.set("q", state.q);
      if (state.sort !== "change_desc") p.set("sort", state.sort);
      if (state.period !== DEFAULT_PERIOD) p.set("p", state.period);
      history.replaceState(null, "", p.toString() ? "#" + p : location.pathname + location.search);
    }
    function readHash() {
      const p = new URLSearchParams(location.hash.slice(1));
      state.segment = p.get("seg") || "All";
      state.status = STATUS[p.get("status")] ? p.get("status") : "all";
      state.q = p.get("q") || "";
      setPeriod(p.get("p"));
      state.sort = ["change_desc", "change_asc", "recent_desc", "az"].includes(p.get("sort")) ? p.get("sort") : "change_desc";
      document.getElementById("q").value = state.q;
      document.getElementById("sort").value = state.sort;
    }

    function update() { writeHash(); renderTabs(); renderPeriods(); renderHint(); render(); }

    function bindControls() {
      let t;
      document.getElementById("q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; update(); }, 150); });
      document.getElementById("sort").addEventListener("change", e => {
        state.sort = e.target.value;
        // picking "fallers" with the Rising chip active shows nothing useful, so follow the intent
        if (state.sort === "change_asc" && state.status === "rising") state.status = "falling";
        if (state.sort === "change_desc" && state.status === "falling") state.status = "rising";
        update();
      });
    }

  async function load() {
  try {
    const files = [
      ["Accounts", "data/accounts.json"],
      ["Currencies", "data/currencies.json"],
      ["Top Ups", "data/topups.json"],
    ];
    const results = await Promise.all(files.map(async ([name, url]) => {
      const res = await fetch(url + "?t=" + Date.now());
      if (!res.ok) throw new Error(url + " HTTP " + res.status);
      return [name, await res.json()];
    }));
    DATA = {
      generatedAt: results.map(([, d]) => d.generatedAt).sort().pop(),
      segments: results.map(([name, d]) => ({ name, keywords: d.items || [] })),
    };
    document.getElementById("meta").innerHTML = "<span>Updated</span> " + esc(new Date(DATA.generatedAt).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }));
    GRID = buildGrid();
    ITEMS = buildItems();
    readHash(); bindControls(); update();
  } catch (e) {
    document.getElementById("meta").textContent = "";
    document.getElementById("content").innerHTML =
      '<div class="error">Could not load data: ' + esc(e.message) + '</div>';
  }
}
    load();
  </script>
</body>
</html>
