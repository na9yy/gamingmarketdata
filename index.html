  <style>
    :root {
      --blue: #0B6CFB; --blue-light: #5AA8F7; --blue-glow: rgba(11,108,251,.35);
      --bg: #10151E; --panel: #161D28; --panel-2: #1D2532; --panel-3: #252F3F;
      --border: #232C3A; --text: #F4F6FA; --muted: #9AA6B8; --faint: #637085;
      --up: #3DDC84; --down: #F2555A; --new: #F5B83D;
      --font: "Red Hat Display", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body { margin: 0; color: var(--text); font: 500 13px/1.45 var(--font); -webkit-font-smoothing: antialiased;
      background: radial-gradient(1100px 300px at 50% -160px, rgba(21,49,81,.9), transparent 70%), var(--bg); background-repeat: no-repeat; }
    button, select, input { font-family: var(--font); }

    /* sticky header: logo, search, filters all in view */
    .head { position: sticky; top: 0; z-index: 20; background: rgba(16,21,30,.94); backdrop-filter: blur(10px);
      border-bottom: 1px solid var(--border); }
    .bar { max-width: 1600px; margin: 0 auto; padding: 8px 20px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 14px; }
    .bar + .bar { padding-top: 0; flex-wrap: wrap; gap: 8px 12px; }
    .logo img { height: 26px; width: auto; display: block; }
    .title { font-weight: 800; font-size: 14px; white-space: nowrap; color: var(--muted); }
    .search { position: relative; flex: 1; max-width: 520px; }
    .search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 15px; height: 15px; color: var(--faint); }
    .search input { width: 100%; background: var(--panel); border: 1px solid var(--border); color: var(--text);
      border-radius: 8px; padding: 7px 10px 7px 32px; font-size: 13px; font-weight: 500; }
    .search input::placeholder { color: var(--faint); }
    .meta { margin-left: auto; color: var(--faint); font-size: 12px; white-space: nowrap; }
    .meta span { color: var(--muted); }

    .seg-row { display: flex; gap: 2px; min-width: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 2px; }
    .tab { display: inline-flex; align-items: center; gap: 6px; background: none; border: 0; color: var(--muted);
      padding: 5px 10px; border-radius: 6px; cursor: pointer; font-size: 12.5px; font-weight: 700; white-space: nowrap; }
    .tab:hover { color: var(--text); }
    .tab .ic { display: inline-grid; color: inherit; }
    .tab .ic svg { width: 13px; height: 13px; }
    .tab.active { background: var(--blue); color: #fff; }

    .chips { display: flex; flex-wrap: wrap; gap: 4px; }
    .chip { background: none; border: 1px solid var(--border); color: var(--muted); padding: 4px 9px;
      border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 700; }
    .chip:hover { color: var(--text); }
    .chip .n { color: var(--faint); margin-left: 5px; font-variant-numeric: tabular-nums; }
    .chip.active { color: #fff; background: var(--panel-3); border-color: var(--panel-3); }
    .chip.active .n { color: var(--muted); }
    .chip.active[data-s="rising"] { background: rgba(61,220,132,.14); color: var(--up); border-color: rgba(61,220,132,.4); }
    .chip.active[data-s="breakout"] { background: rgba(245,184,61,.14); color: var(--new); border-color: rgba(245,184,61,.4); }
    .chip.active[data-s="falling"] { background: rgba(242,85,90,.14); color: var(--down); border-color: rgba(242,85,90,.4); }

    .controls { display: flex; gap: 8px; align-items: center; margin-left: auto; }
    .controls + .meta { margin-left: 0; }
    .periods { display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 2px; gap: 2px; }
    .period { background: none; border: 0; color: var(--muted); padding: 4px 9px; border-radius: 6px; cursor: pointer; font-size: 12px; font-weight: 700; }
    .period:hover { color: var(--text); }
    .period.active { background: var(--blue); color: #fff; }
    select { background: var(--panel); color: var(--text); border: 1px solid var(--border); border-radius: 8px; padding: 5px 8px; font-size: 12px; font-weight: 700; }
    .views { display: inline-flex; background: var(--panel); border: 1px solid var(--border); border-radius: 8px; padding: 2px; gap: 2px; }
    .views button { background: none; border: 0; color: var(--muted); padding: 4px 7px; border-radius: 6px; cursor: pointer; display: grid; place-items: center; }
    .views button svg { width: 14px; height: 14px; }
    .views button.active { background: var(--panel-3); color: #fff; }
    .info { position: relative; color: var(--faint); cursor: help; display: grid; place-items: center; }
    .info svg { width: 15px; height: 15px; }
    .info .tip { display: none; position: absolute; right: 0; top: 24px; width: 320px; background: var(--panel-2); border: 1px solid var(--border);
      color: var(--muted); padding: 10px 12px; border-radius: 8px; font-size: 12px; line-height: 1.5; box-shadow: 0 10px 30px rgba(0,0,0,.4); }
    .info:hover .tip, .info:focus .tip { display: block; }
    .tab:focus-visible, .chip:focus-visible, .period:focus-visible, select:focus-visible, input:focus-visible, a:focus-visible, .views button:focus-visible, .info:focus-visible {
      outline: 2px solid var(--blue); outline-offset: 1px; }

    .wrap { max-width: 1600px; margin: 0 auto; padding: 4px 20px 48px; }

    .section-title { display: flex; align-items: baseline; gap: 8px; font-size: 15px; font-weight: 800; margin: 18px 0 8px; }
    .section-title .n { color: var(--faint); font-weight: 700; font-size: 12px; }
    .section-title.top-title::before { content: "★"; color: var(--blue-light); font-size: 12px; }
    .divider-all { color: var(--faint); font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
      margin: 22px 0 0; padding-top: 12px; border-top: 1px solid var(--border); }

    /* cards */
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 8px; }
    .card { min-width: 0; background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 10px 10px 4px; }
    .card:hover { border-color: #33415A; }
    .card.dim { opacity: .5; }
    .card.dim:hover { opacity: .85; }
    .card.top-card { border-color: rgba(11,108,251,.35); }
    .card .top { display: flex; align-items: center; gap: 8px; }
    .thumb { width: 30px; height: 30px; flex: none; border-radius: 7px; background: var(--panel-2);
      display: grid; place-items: center; overflow: hidden; font-weight: 800; font-size: 10px; color: var(--muted); }
    .thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
    .card .name { min-width: 0; flex: 1; }
    .kw { font-size: 13px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
      color: var(--text); text-decoration: none; display: block; }
    a.kw:hover { color: var(--blue-light); }
    .card .seg { font-size: 11px; color: var(--faint); }
    .card .val { text-align: right; line-height: 1.1; }
    .card .num { font-size: 17px; font-weight: 800; font-variant-numeric: tabular-nums; }
    .badge { display: inline-block; font-size: 11px; font-weight: 800; padding: 1px 6px; border-radius: 5px; margin-top: 3px;
      white-space: nowrap; font-variant-numeric: tabular-nums; }
    .badge.rising { background: rgba(61,220,132,.14); color: var(--up); }
    .badge.breakout { background: rgba(245,184,61,.14); color: var(--new); }
    .badge.falling { background: rgba(242,85,90,.14); color: var(--down); }
    .badge.stable, .badge.low { background: var(--panel-2); color: var(--muted); }
    .sub { font-size: 11px; color: var(--faint); margin-top: 6px; font-variant-numeric: tabular-nums; }
    .sub b { color: var(--muted); font-weight: 700; }
    .chart-box { position: relative; height: 64px; margin: 2px -4px 0; min-width: 0; }

    /* table view */
    .tbl-wrap { overflow-x: auto; border: 1px solid var(--border); border-radius: 10px; background: var(--panel); }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { padding: 5px 10px; border-bottom: 1px solid var(--border); text-align: right; white-space: nowrap; }
    th { position: sticky; top: 0; background: var(--panel-2); color: var(--faint); font-size: 11px; font-weight: 800;
      text-transform: uppercase; letter-spacing: .04em; cursor: pointer; user-select: none; }
    th:hover { color: var(--text); }
    th.on { color: var(--blue-light); }
    th:first-child, td:first-child, th:nth-child(2) { text-align: left; }
    table { table-layout: fixed; min-width: 760px; }
    td .kw { overflow: hidden; text-overflow: ellipsis; }
    tr:last-child td { border-bottom: 0; }
    tbody tr:hover { background: var(--panel-2); }
    tr.dim td { opacity: .5; }
    td .cell { display: flex; align-items: center; gap: 8px; max-width: 340px; }
    td .thumb { width: 22px; height: 22px; border-radius: 5px; font-size: 9px; }
    td .kw { font-size: 12.5px; }
    td.segc { color: var(--faint); text-align: left; }
    td.num2 { font-weight: 700; }
    td .badge { margin: 0; }
    td.spark { padding: 2px 10px; }
    td.spark div { position: relative; height: 26px; width: 100%; }

    .empty, .error { background: var(--panel); border: 1px dashed var(--border); border-radius: 10px; padding: 30px; text-align: center; color: var(--muted); margin-top: 12px; }
    .error { color: var(--down); }

    @media (max-width: 760px) {
      .bar { padding: 8px 12px; gap: 10px; }
      .title, .meta { display: none; }
      .head { position: static; }
      .search { max-width: none; }
      .seg-row { overflow-x: auto; max-width: 100%; scrollbar-width: none; }
      .search { order: 2; flex-basis: 100%; }
      .controls { order: 3; }
      .bar > * { min-width: 0; }
      .views, .info { display: none; }
      .controls { margin-left: 0; width: 100%; }
      .periods { flex: 1; } .period { flex: 1; }
      .wrap { padding: 4px 12px 40px; }
      .grid { grid-template-columns: minmax(0, 1fr); }
      .info .tip { right: -8px; width: 260px; }
    }
  </style>
</head>

    let DATA = null, GRID = [], ITEMS = [];

    function fmtDate(iso) { try { return new Date(iso).toLocaleString(); } catch { return iso; } }
    const iso = t => new Date(t).toISOString().slice(0, 10);
    const avg = a => a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0;
    const esc = s => String(s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

    // Weekly date grid across all keywords. Weeks missing from a keyword = 0 interest.
    function buildGrid() {
      const dates = new Set();
      for (const s of DATA.segments) for (const k of s.keywords || []) for (const p of k.points || []) dates.add(p.date);
      if (!dates.size) return [];
      const sorted = [...dates].sort();
      const start = Date.parse(sorted[0]), end = Date.parse(sorted[sorted.length - 1]);
      const grid = [];
      for (let t = start; t <= end; t += WEEK) grid.push(iso(t));
      return grid;
    }

    function buildItems() {
      const items = [];
      for (const seg of DATA.segments) {
        for (const k of seg.keywords || []) {
          const m = new Map((k.points || []).map(p => [p.date, p.value ?? 0]));
          items.push({ keyword: k.keyword, segment: seg.name, series: GRID.map(d => m.get(d) ?? 0) });
        }
      }
      return items;
    }

    function score(series) {
      const [rN, bN] = state.win.split("-").map(Number);
      const recentArr = series.slice(-rN);
      const baseArr = series.slice(-(rN + bN), -rN);
      const recent = avg(recentArr), base = avg(baseArr);
      const active = recentArr.concat(baseArr).filter(v => v > 0).length;
      let status, change = null;
      if (active < MIN_ACTIVE_WEEKS) status = "low";
      else if (base === 0) { status = recent > 0 ? "breakout" : "low"; change = recent > 0 ? Infinity : null; }
      else {
        change = (recent - base) / base * 100;
        status = change >= state.thr ? "rising" : change <= -state.thr ? "falling" : "stable";
      }
      return { recent, base, change, status, latest: series[series.length - 1] ?? 0 };
    }

    function sortFn(a, b) {
      // Tier: 0 = real data, 1 = low data, 2 = zero in the window (always last)
      const tier = i => i.s.status !== "low" ? 0 : (i.s.recent > 0 || i.s.base > 0) ? 1 : 2;
      const t = tier(a) - tier(b);
      if (t !== 0) return t;

      const cmp = (x, y) => (x === y ? 0 : x > y ? 1 : -1);
      switch (state.sort) {
        case "change_asc":  return cmp(a.s.change ?? Infinity, b.s.change ?? Infinity);
        case "recent_desc": return b.s.recent - a.s.recent;
        case "az":          return a.keyword.localeCompare(b.keyword);
        default:            return cmp(b.s.change ?? -Infinity, a.s.change ?? -Infinity);
      }
    }

    function fmtChange(s) {

    function identity(item) {
      const { keyword, segment } = item;
      const gift = segment === "Gift Cards" ? giftLogo(keyword) : null;
      const slug = segment === "Gift Cards" && gift ? null : gameSlug(keyword);

      const wrap = document.createElement("div"); wrap.className = "tbl-wrap";
      const head = COLS.map(c => {
        const on = c.key && (state.sort === c.key || state.sort === c.alt);
        const arrow = on ? (state.sort === "change_asc" ? " ▲" : state.sort === "az" ? " ▲" : " ▼") : "";
        return `<th data-k="${c.key || ""}" data-alt="${c.alt || ""}" class="${on ? "on" : ""}">${c.label}${arrow}</th>`;
      }).join("");
      wrap.innerHTML = `<table><colgroup><col style="width:32%"><col style="width:11%"><col style="width:8%"><col style="width:10%"><col style="width:10%"><col style="width:11%"><col style="width:18%"></colgroup><thead><tr>${head}</tr></thead><tbody></tbody></table>`;
      wrap.querySelectorAll("th").forEach(th => {
        const k = th.dataset.k; if (!k) { th.style.cursor = "default"; return; }
        th.onclick = () => { state.sort = state.sort === k && th.dataset.alt ? th.dataset.alt : k; document.getElementById("sort").value = state.sort; update(); };
      });
      const tb = wrap.querySelector("tbody");
      for (const item of list) {
        const { keyword, segment, s } = item;
        const { thumb, title } = identity(item);
        const tr = document.createElement("tr");
        if (s.status === "low") tr.className = "dim";
        tr.innerHTML = `<td><div class="cell"><div class="thumb">${thumb}</div>${title}</div></td>
          <td class="segc">${esc(segment)}</td><td class="num2">${s.latest}</td>
          <td>${s.recent.toFixed(1)}</td><td>${s.base.toFixed(1)}</td>
          <td><span class="badge ${s.status}">${fmtChange(s)}</span></td>
          <td class="spark"><div><canvas></canvas></div></td>`;
        tr._item = item;
        tb.appendChild(tr); observe(tr);
      }
      return wrap;
    }

    function destroyCharts() {
      for (const c of charts.values()) { try { c.destroy(); } catch {} }
      charts.clear();
      if (observer) observer.disconnect();
    }

    // Only draw charts when a card scrolls into view (242+ canvases at once is slow)
    function observe(card) {
      if (!("IntersectionObserver" in window)) return renderChart(card);
      if (!observer) observer = new IntersectionObserver(entries => {
        for (const e of entries) if (e.isIntersecting) { renderChart(e.target); observer.unobserve(e.target); }
      }, { rootMargin: "200px" });
      observer.observe(card);
    }

    function renderChips(scored) {
      const counts = { all: scored.length };
      for (const i of scored) counts[i.s.status] = (counts[i.s.status] || 0) + 1;
      const chips = document.getElementById("chips");
      chips.innerHTML = "";
      for (const [key, { label }] of Object.entries(STATUS)) {
        const b = document.createElement("button");
        b.className = "chip" + (state.status === key ? " active" : "");
        b.dataset.s = key;
        b.innerHTML = `${label}<span class="n">${counts[key] || 0}</span>`;
        b.onclick = () => { state.status = key; update(); };
        chips.appendChild(b);
      }
    }

    function render() {
      destroyCharts();
      const content = document.getElementById("content");
      content.innerHTML = "";
      if (!DATA || !DATA.segments || !DATA.segments.length || !GRID.length) {
        content.innerHTML = '<div class="empty">No trend data yet. The daily workflow will populate this.</div>';
        document.getElementById("chips").innerHTML = "";
        return;
      }
      const q = state.q.trim().toLowerCase();
      // score everything in the active segment + search, so chip counts match what you can filter to
      const pool = ITEMS
        .filter(i => state.segment === "All" || i.segment === state.segment)
        .filter(i => !q || i.keyword.toLowerCase().includes(q) || (gameSlug(i.keyword) || "").replace(/-/g, " ").includes(normName(q)))
        .map(i => ({ ...i, s: score(i.series) }));
      renderChips(pool);

      renderTop(content);
      if (content.children.length) content.insertAdjacentHTML("beforeend", '<div class="divider-all">All tracked products</div>');
      const shown = pool.filter(i => state.status === "all" || i.s.status === state.status).sort(sortFn);
      if (!shown.length) { content.insertAdjacentHTML("beforeend", '<div class="empty">Nothing matches these filters.</div>'); return; }

      const bySeg = new Map();
      for (const i of shown) { if (!bySeg.has(i.segment)) bySeg.set(i.segment, []); bySeg.get(i.segment).push(i); }
      for (const [name, list] of bySeg) {
        const title = document.createElement("div");
        title.className = "section-title";
        title.innerHTML = `${esc(name)}<span class="n">${list.length}</span>`;
        content.appendChild(title);
        if (state.view === "table") { content.appendChild(keywordTable(list)); continue; }
        const grid = document.createElement("div"); grid.className = "grid";
        for (const i of list) { const c = keywordCard(i); grid.appendChild(c); observe(c); }
        content.appendChild(grid);
      }
    }

    // ---------- Our top products this year: their Google Trends ----------
    // Game slugs of GameBoost's biggest products per category. Edit these lists to change the section.
    const TOP_PRODUCTS = [
      { title: "Top GameBoost Accounts This Year", segs: ["Accounts"],
        games: ["clash-of-clans","clash-royale","valorant","league-of-legends","call-of-duty","raid-shadow-legends","grand-theft-auto-v","brawl-stars","pubg-mobile","rocket-league","summoners-war","genshin-impact"] },
      { title: "Top GameBoost Top Ups & Currencies This Year", segs: ["Top Ups", "Currencies"],
        games: ["fortnite","roblox","pubg-mobile","valorant","genshin-impact","pokemon-go","donutsmp","blade-ball","mobile-legends","old-school-runescape","wow-classic-era","apex-legends"] },
      { title: "Top GameBoost Items This Year", segs: ["Items"],
        games: ["steal-a-brainrot","grow-a-garden","grow-a-garden-2","murder-mystery-2","blox-fruits","adopt-me","plants-vs-brainrots","arc-raiders","clash-of-clans","growtopia","pubg-mobile","brawl-stars"] },
    ];
    function renderTop(content) {
      if (state.q || state.status !== "all") return;
      const groups = TOP_PRODUCTS.filter(g => state.segment === "All" || g.segs.includes(state.segment));
      for (const g of groups) {
        // best trend keyword per game in these categories (highest recent interest)
        const picks = [];
        for (const slug of g.games) {
          const m = ITEMS.filter(i => g.segs.includes(i.segment) && gameSlug(i.keyword) === slug)
            .map(i => ({ ...i, s: score(i.series) }))
            .sort((a, b) => b.s.recent - a.s.recent)[0];
          if (m && !picks.some(p => p.keyword === m.keyword)) picks.push(m);
        }
        if (!picks.length) continue;
        picks.sort(sortFn);
        const title = document.createElement("div");
        title.className = "section-title top-title";
        title.innerHTML = `${esc(g.title)}<span class="n">${picks.length}</span>`;
        content.appendChild(title);
        const grid = document.createElement("div"); grid.className = "grid";
        if (state.view === "table") { content.appendChild(keywordTable(picks)); continue; }
        for (const i of picks) { const c = keywordCard(i); c.classList.add("top-card"); grid.appendChild(c); observe(c); }
        content.appendChild(grid);
      }
    }

    function renderTabs() {
      const tabs = document.getElementById("tabs");
      tabs.innerHTML = "";
      const names = ["All", ...DATA.segments.map(s => s.name)];
      if (names.length <= 2) return; // only one segment, tabs add nothing
      for (const name of names) {
        const b = document.createElement("button");
        b.className = "tab" + (name === state.segment ? " active" : "");
        b.innerHTML = `<span class="ic">${SEG_ICON[name] || ""}</span>${esc(name)}`;
        b.onclick = () => { state.segment = name; update(); };
        tabs.appendChild(b);
      }
    }

    function renderHint() {
      const p = PERIODS[state.period];
      const [rN, bN] = state.win.split("-");
      const last = GRID[GRID.length - 1];
      document.getElementById("hint").textContent =
        (state.period === DEFAULT_PERIOD
          ? `Charts show the last 2 years (weekly data). Change compares avg interest in the last ${rN} weeks to the ${bN} weeks before. `
          : `Charts show the ${p.label.toLowerCase()} (weekly data). Change compares its avg interest to the ${p.text} before. `) +
        `Rising/Falling = change beyond ±${state.thr}%. Breakout = zero before, active now. ` +
        `Low data = under ${MIN_ACTIVE_WEEKS} active weeks. Latest week: ${last || "—"}. Press / to search.`;
    }

    function setPeriod(key) {
      state.period = PERIODS[key] ? key : DEFAULT_PERIOD;
      const p = PERIODS[state.period];
      state.win = p.win || `${p.weeks}-${p.weeks}`;
    }

    function compareText(s) {
      const p = PERIODS[state.period];
      if (state.period === DEFAULT_PERIOD) {
        const [rN, bN] = state.win.split("-");
        return `${rN}w avg <b>${s.recent.toFixed(1)}</b> · prior ${bN}w <b>${s.base.toFixed(1)}</b>`;
      }
      return `${p.short} avg <b>${s.recent.toFixed(1)}</b> · prior ${p.short} <b>${s.base.toFixed(1)}</b>`;
    }

    function renderPeriods() {
      const box = document.getElementById("periods");
      box.innerHTML = "";
      for (const [key, p] of Object.entries(PERIODS)) {
        const b = document.createElement("button");
        b.className = "period" + (key === state.period ? " active" : "");
        b.textContent = p.short; b.title = p.label; b.setAttribute("aria-pressed", key === state.period);
        b.onclick = () => { setPeriod(key); update(); };
        box.appendChild(b);
      }
    }

    function writeHash() {
      const p = new URLSearchParams();
      if (state.segment !== "All") p.set("seg", state.segment);
      if (state.status !== "all") p.set("status", state.status);
      if (state.q) p.set("q", state.q);
      if (state.sort !== "change_desc") p.set("sort", state.sort);
      if (state.period !== DEFAULT_PERIOD) p.set("p", state.period);
      if (state.view !== "cards") p.set("v", state.view);
      history.replaceState(null, "", p.toString() ? "#" + p : location.pathname + location.search);
    }
    function readHash() {
      const p = new URLSearchParams(location.hash.slice(1));
      state.segment = p.get("seg") || "All";
      state.status = STATUS[p.get("status")] ? p.get("status") : "all";
      state.q = p.get("q") || "";
      setPeriod(p.get("p"));
      state.view = p.get("v") === "table" ? "table" : "cards";
      state.sort = ["change_desc", "change_asc", "recent_desc", "az"].includes(p.get("sort")) ? p.get("sort") : "change_desc";
      document.getElementById("q").value = state.q;
      document.getElementById("sort").value = state.sort;
    }

    function renderViews() {
      document.getElementById("v-cards").classList.toggle("active", state.view === "cards");
      document.getElementById("v-table").classList.toggle("active", state.view === "table");
    }
    function update() { writeHash(); renderTabs(); renderPeriods(); renderViews(); renderHint(); render(); }

    function bindControls() {
      let t;
      document.getElementById("v-cards").onclick = () => { state.view = "cards"; update(); };
      document.getElementById("v-table").onclick = () => { state.view = "table"; update(); };
      document.addEventListener("keydown", e => {
        if (e.key === "/" && document.activeElement.tagName !== "INPUT") { e.preventDefault(); document.getElementById("q").focus(); }
        if (e.key === "Escape" && document.activeElement.id === "q") { e.target.value = ""; state.q = ""; update(); }
      });
      document.getElementById("q").addEventListener("input", e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; update(); window.scrollTo(0, 0); }, 150); });
      document.getElementById("sort").addEventListener("change", e => {
        state.sort = e.target.value;
        // picking "fallers" with the Rising chip active shows nothing useful, so follow the intent
        if (state.sort === "change_asc" && state.status === "rising") state.status = "falling";
        if (state.sort === "change_desc" && state.status === "falling") state.status = "rising";
        update();
      });
    }

  async function load() {
  try {
    const files = [
      ["Accounts", "data/accounts.json"],
      ["Currencies", "data/currencies.json"],
      ["Top Ups", "data/topups.json"],
      ["Items", "data/items.json"],
      ["Gift Cards", "data/giftcards.json"],
    ];
    const results = await Promise.all(files.map(async ([name, url]) => {
      const res = await fetch(url + "?t=" + Date.now());
      if (!res.ok) throw new Error(url + " HTTP " + res.status);
      return [name, await res.json()];
    }));
    DATA = {
      generatedAt: results.map(([, d]) => d.generatedAt).sort().pop(),
      segments: results.map(([name, d]) => ({ name, keywords: d.items || [] })),
    };
    document.getElementById("meta").innerHTML = "<span>Updated</span> " + esc(new Date(DATA.generatedAt).toLocaleDateString(undefined, { day: "numeric", month: "short", year: "numeric" }));
    GRID = buildGrid();
    ITEMS = buildItems();
    readHash(); bindControls(); update();
  } catch (e) {
    document.getElementById("meta").textContent = "";
    document.getElementById("content").innerHTML =
      '<div class="error">Could not load data: ' + esc(e.message) + '</div>';
  }
}
    load();
  </script>
</body>
</html>
